<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Voluntário - ONG Esperança</title>
    <link
      rel="shortcut icon"
      href="assets/icones/ongesperanca.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style/index.css" />
    <script type="text/javascript" src="script/util.js"></script>
    <script type="text/javascript" src="script/cadastro.js"></script>
  </head>

  <body onload="initCadastro()">
    <div class="content">
      <header>
        <div class="banner"></div>

        <div class="topbar-container">
          <div class="topbar-content">
            <div class="menu-container">
              <nav class="menu">
                <ul>
                  <li><a href="index.html">Início</a></li>
                  <li><a href="projetos.html">Projetos</a></li>
                  <li>
                    <a class="menu-active" href="cadastro.html">Cadastro</a>
                  </li>
                </ul>
              </nav>
            </div>
            <div class="logo-container">
              <img src="assets/imagens/logo.jpg" alt="Logo da ONG Esperança" />
            </div>
          </div>
        </div>
      </header>
      <main>
        <div class="main-container">
          <div id="feedback-box" class="feedback-box hidden"></div>
          <form>
            <fieldset>
              <legend>Informações Pessoais</legend>

              <div class="grid grid-5">
                <div class="input-item">
                  <label
                    >Nome Completo<span class="red">*</span>
                    <input id="nome" type="text" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >Email<span class="red">*</span>
                    <input id="email" type="email" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >CPF<span class="red">*</span>
                    <input id="cpf" type="text" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >Telefone
                    <input id="telefone" type="text" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >Data de Nascimento<span class="red">*</span>
                    <input id="data-nascimento" type="date" />
                  </label>
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>Endereço</legend>
              <div class="grid grid-4">
                <div class="input-item">
                  <label
                    >Endereço
                    <input id="endereco" type="text" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >CEP
                    <input id="cep" type="text" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >Cidade
                    <input id="cidade" type="text" />
                  </label>
                </div>
                <div class="input-item">
                  <label
                    >Estado
                    <input id="estado" type="text" />
                  </label>
                </div>
              </div>
            </fieldset>

            <button type="button" onclick="enviarDados()">
              Enviar Cadastro
            </button>
            <button type="reset">Limpar</button>
            <button disabled>Suporte</button>
          </form>
        </div>
      </main>

      <footer>
        <p>&copy; 2025 ONG Esperança</p>
      </footer>
    </div>
  </body>
</html>
